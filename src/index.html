<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrayerTimes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/03c501ea17.js" crossorigin="anonymous"></script>
    <script src="../node_modules/axios/dist/axios.js"></script>
    <script src="../node_modules/moment/min/moment.min.js"></script>
    <script src="../node_modules/moment/locale/ar.js"></script>
</head>
<body style="font-family: 'Tajawal', sans-serif;   font-weight: 400;
  font-style: normal;">
    <div class="main-content" style="padding: 0;">
        <nav>
            <div class="logo">
            <h1 class="name">مواقيت الصلاة</h1>
            <i class="fa-solid fa-mosque mlogo"></i>
            </div>
<div class="city-select">
    <i class="fa-solid fa-location-dot"></i>            

    <select>



    </select>
</div>
        </nav>
            
                <section class="hero" dir="rtl">
                    <div class="hero-content">
                    <div class="loc">
                        <h4>طرابلس-ليبيا</h4>
                        <i class="fa-solid fa-location-dot"></i>            

                    </div>
                    <div class="date">
                       
                    </div>
                    <h1>
                       <span class="n1">أوقـات الصلاة </span> <br>
                       <span class="n2">دائماً ..  في وقتها</span> 

                    </h1>
                    <div class="dis">
                        <p>معنا تعرف على مواقيت الصلاة في مدينتك بدقة .</p>
                    </div>
                    </div>
                        <div class="nextPray">
                        <div class="icon-nextPray">
                            <i class="fa-solid fa-mosque next"></i>
                        </div>
                        <div class="details">
                            <p>الصلاة القادمة</p>
                            <h1 id="nextPrayName">العصر</h1>
                            <h1 id="nextPrayTime"> 04:12 م</h1>      
                        </div>
                    </div>
                    
                </section>

                <section class="prayer-cards">
                    <div class="card" id="IshaPray" >
                        <div class="icon">
                            <i class="fa-solid fa-moon"></i>
                        </div>
                        <div class="prayName" >
                            <h3>العشاء</h3>
                       </div>
                        <div class="PrayTime" dir="rtl" id="Isha"></div>
                    </div>
                    
                    
                    <div class="card" id="MaghribPray">
                        <div class="icon">
                            <i class="fa-solid fa-cloud-sun Maghrib"></i>
                        </div>
                        <div class="prayName" >
                            <h3>المغرب</h3>
                        </div>
                        <div class="PrayTime" dir="rtl" id="Maghrib"></div>
                    </div>
                    
                    
                    <div class="card" id="AsrPray">
                        <div class="icon">
                            <i class="fa-solid fa-mountain-sun Asr"></i>
                        </div>
                        <div class="prayName" id="AsrPray">
                            <h3>العصر</h3>
                        </div>
                        <div class="PrayTime" dir="rtl" id="Asr"></div>
                    </div>
                    
                    
                    
                    <div class="card" id="DhuhrPray">
                        <div class="icon">
                            <i class="fa-solid fa-sun"></i>
                        </div>
                        <div class="prayName" id="DhuhrPray">
                            <h3>الظهر</h3>
                        </div>
                        <div class="PrayTime" dir="rtl" id="Dhuhr"></div>
                    </div>
                    
                    
                    
                    <div class="card" id="ShoroqPray">
                        <div class="icon">
                            <i class="fa-solid fa-cloud-sun Shoroq"></i>
                        </div>
                        <div class="prayName" id="ShoroqPray">
                            <h3>الشروق</h3>
                        </div>
                        <div class="PrayTime" dir="rtl" id="Shoroq"></div>
                    </div>
                    
                    
                    
                    
                    <div class="card" id="FajrPray">
                        <div class="icon">
                            <i class="fa-solid fa-moon"></i>
                        </div>
                        <div class="prayName" id="FajrPray">
                            <h3>الفجر</h3>
                        </div>
                        <div class="PrayTime" dir="rtl" id="Fajr">05:12 ص</div>
                    </div>
                </section>
                </div>
</body>





<script>
    let cities = [
    {
        name: "طرابلس",
        city: "Ţarābulus",
        lat: 32.8874,
        lng: 13.1873
    },
    {
        name: "بنغازي",
        city: "Banghāzī",
        lat: 32.1167,
        lng: 20.0667
    },
    {
        name: "مصراتة",
        city: "Mişrātah",
        lat: 32.377533,
        lng: 15.092017
    },
    {
        name: "الزاوية",
        city: "Az Zāwiyah",
        lat: 32.749997,
        lng: 12.7166638
    },
    {
        name: "سبها",
        city: "Sabhā",
        lat: 27.03766,
        lng: 14.42832
    }
];
    for(let city of cities){
        const content=`
        <option value='{"city":"${city.city}","arabicCity":"${city.name}","lat":${city.lat},"lng":${city.lng}}'>
            ${city.name}
        </option>
        `
        document.querySelector("select").innerHTML+=content;
    }
        //document.querySelector(".date").innerText=""
        
        //to chane the language of the date to arabic
            function getPrayersTime(cityName) {
                let params={
                    country:"LY",
                    city:cityName
                }
                    axios.get(
            "https://api.aladhan.com/v1/timingsByCity",
            {
                params:params
            }
            )
    .then((response) => {
        
      const PrayTime=response.data.data.timings;

        FillTimeForPrayer("Fajr", PrayTime.Fajr+" ص");

        FillTimeForPrayer("Shoroq", PrayTime.Sunrise+" ص");

        FillTimeForPrayer("Dhuhr", PrayTime.Dhuhr+" م");

        FillTimeForPrayer("Asr", PrayTime.Asr+" م");

        FillTimeForPrayer("Maghrib", PrayTime.Maghrib+" م");

        FillTimeForPrayer("Isha", PrayTime.Isha+" م");


        const date=response.data.data.date.gregorian.date;
        const weakday=response.data.data.date.hijri.weekday.ar;
        const hijriDate=response.data.data.date.hijri.date;
        const hijriMonth=response.data.data.date.hijri.month.ar;
         document.querySelector(".date").innerText=weakday+" , "+hijriDate+" | "+date+ " | " + hijriMonth;
    })
    .catch((error) => {
      console.log(error);
    });
}
            getPrayersTime("طرابلس");

            document.querySelector("select").addEventListener("change",function(event){
            console.log(event.target.value);
            const data=JSON.parse(event.target.value);
            document.querySelector(".loc h4").innerText=data.arabicCity+" - ليبيا";
            getPrayersTime(data.city);
            getNextPray(data.lat, data.lng);
        })

        
        function getNextPray(lat,lng){
            axios.get(`https://api.aladhan.com/v1/nextPrayer?latitude=${lat}&longitude=${lng}`)
            .then((response)=>{
                //to get the key in the response object
                //console.log(Object.keys(response.data.data.timings));
                let cardStyle=`
                            background: rgba(15, 118, 110, 0.19);
                            border-radius: 16px;
                            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
                            backdrop-filter: blur(5px);
                            -webkit-backdrop-filter: blur(5px);
                            border: 1px solid rgba(15, 118, 110, 0.3);
                     `;
                let nextPrayName="";
                if(Object.keys(response.data.data.timings)[0]==="Fajr"){
                     nextPrayName="الفجر";
                     document.getElementById("FajrPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Sunrise"){
                     nextPrayName="الشروق";
                    document.getElementById("ShoroqPray").style=cardStyle;
                    }
                else if(Object.keys(response.data.data.timings)[0]==="Dhuhr"){
                     nextPrayName="الظهر";
                     document.getElementById("DhuhrPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Asr"){
                     nextPrayName="العصر";
                     document.getElementById("AsrPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Maghrib"){
                     nextPrayName="المغرب";
                     document.getElementById("MaghribPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Isha"){
                     nextPrayName="العشاء";
                     document.getElementById("IshaPray").style=cardStyle;
                }
                document.getElementById("nextPrayName").innerText=nextPrayName;
                console.log(Object.values(response.data.data.timings)[0]);
                document.getElementById("nextPrayTime").innerText=Object.values(response.data.data.timings)[0];
                console.log(Object.keys(response.data.data.timings)[0]);
                console.log(Object.values(response.data.data.timings)[0]);
                
            }).catch((error)=>{
                console.log(error);
            })
        }
        getNextPray(32.8874, 13.1873);
        function FillTimeForPrayer(id,time){
            document.getElementById(id).innerText=time;
        }
</script>
</html>
