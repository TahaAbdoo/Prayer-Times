                <section class="hero" dir="rtl">

<script>
        //document.querySelector(".date").innerText=""
        
        //to chane the language of the date to arabic
        moment.locale('ar');
        document.querySelector(".date").innerText=moment().format('dddd , Do MMMM  YYYY');
        console.log(moment().format('dddd , Do MMMM  YYYY'));
            function getPrayersTime(latitude, longitude) {
        axios.get(
            `https://api.aladhan.com/v1/timings/29-09-2026?latitude=${latitude}&longitude=${longitude}&shafaq=general`,
            )
    .then((response) => {
        const PrayTime=response.data.data.timings;
      document.getElementById("Fajr").innerText=PrayTime.Fajr+" ص"

      document.getElementById("Shoroq").innerText=PrayTime.Sunrise+" ص"

      document.getElementById("Dhuhr").innerText=PrayTime.Dhuhr+" م"

      document.getElementById("Asr").innerText=PrayTime.Asr+" م"

       console.log(PrayTime.Maghrib);
      document.getElementById("Maghrib").innerText=PrayTime.Maghrib+" م"

      document.getElementById("Isha").innerText=PrayTime.Isha+" م"
    })
    .catch((error) => {
      console.log(error);
    });
}
            getPrayersTime(32.8874, 13.1873);

        document.querySelector("select").addEventListener("change",(event)=>{
            const city = JSON.parse(event.target.value);
            document.querySelector(".loc h4").innerText=city.country+" - ليبيا";
            console.log(city.country);
            console.log(city.lat);
            console.log(city.lng);
            getPrayersTime(city.lat,city.lng);
            getNextPray(city.lat,city.lng);
        })

        
        function getNextPray(latitude, longitude){
            axios.get(`https://api.aladhan.com/v1/nextPrayer/29-09-2026?latitude=${latitude}&longitude=${longitude}&shafaq=general`)
            .then((response)=>{
                //to get the key in the response object
                //console.log(Object.keys(response.data.data.timings));
                let cardStyle=`
                            background: rgba(15, 118, 110, 0.19);
                            border-radius: 16px;
                            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
                            backdrop-filter: blur(5px);
                            -webkit-backdrop-filter: blur(5px);
                            border: 1px solid rgba(15, 118, 110, 0.3);
                     `;
                let nextPrayName="";
                if(Object.keys(response.data.data.timings)[0]==="Fajr"){
                     nextPrayName="الفجر";
                     document.getElementById("FajrPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Sunrise"){
                     nextPrayName="الشروق";
                    document.getElementById("ShoroqPray").style=cardStyle;
                    }
                else if(Object.keys(response.data.data.timings)[0]==="Dhuhr"){
                     nextPrayName="الظهر";
                     document.getElementById("DhuhrPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Asr"){
                     nextPrayName="العصر";
                     document.getElementById("AsrPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Maghrib"){
                     nextPrayName="المغرب";
                     document.getElementById("MaghribPray").style=cardStyle;
                }
                else if(Object.keys(response.data.data.timings)[0]==="Isha"){
                     nextPrayName="العشاء";
                     document.getElementById("IshaPray").style=cardStyle;
                }
                document.getElementById("nextPrayName").innerText=nextPrayName;
                document.getElementById("nextPrayTime").innerText=Object.values(response.data.data.timings)[0];
                console.log(Object.keys(response.data.data.timings)[0]);
                console.log(Object.values(response.data.data.timings)[0]);
                
            }).catch((error)=>{
                console.log(error);
            })
        }
        getNextPray(32.8874, 13.1873);


</script>
</html>
